<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add Receipt — GC Tracker</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GCTracker">
  <meta name="theme-color" content="#0D1B2A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    input, select, textarea, button { font-size: 16px; font-family: inherit; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F8FAFC; color: #1E293B; min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 1rem 1rem 3rem; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0 1.25rem; }
    .brand { font-size: 17px; font-weight: 700; color: #0D1B2A; }
    .brand span { color: #06B6D4; }
    .topbar a { font-size: 13px; color: #64748B; text-decoration: none; }

    label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
            text-transform: uppercase; color: #64748B; margin-bottom: 6px; }
    select, input[type="text"], input[type="number"], input[type="date"], textarea {
      width: 100%; padding: 14px; border: 1px solid #E2E8F0; border-radius: 10px;
      background: white; outline: none; color: #1E293B;
    }
    input[type="date"] { -webkit-appearance: none; }
    select:focus, input:focus, textarea:focus { border-color: #0D1B2A; }
    textarea { resize: vertical; min-height: 70px; }
    .field { margin-bottom: 14px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 10px;
           width: 100%; padding: 18px; border: none; border-radius: 12px;
           font-weight: 600; cursor: pointer; }
    .btn-primary { background: #0D1B2A; color: white; }
    .btn-primary:active { background: #132236; }
    .btn-primary:disabled { background: #94A3B8; }
    .btn-ghost { background: white; color: #0D1B2A; border: 1px solid #E2E8F0; }
    .btn-big { padding: 26px 18px; font-size: 18px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1rem; }

    .card { background: white; border: 1px solid #E2E8F0; border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
    .preview { width: 100%; max-height: 210px; object-fit: contain; border-radius: 10px;
               border: 1px solid #E2E8F0; background: #F8FAFC; margin-bottom: 1rem; }

    .msg { padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 1rem; line-height: 1.5; }
    .msg-error { background: #FEE2E2; color: #991B1B; }
    .msg-warn { background: #FEF3C7; color: #92400E; }
    .msg-ok { background: #D1FAE5; color: #065F46; }

    .spinner { width: 30px; height: 30px; border: 3px solid #E2E8F0; border-top-color: #0D1B2A;
               border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .center { text-align: center; padding: 2.5rem 1rem; color: #64748B; }
    .hint { font-size: 13px; color: #94A3B8; margin-top: 8px; text-align: center; }
    .hide { display: none !important; }
    .big-check { font-size: 42px; margin-bottom: 10px; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- password -->
  <section id="gate">
    <div class="topbar"><div class="brand">GC<span>Tracker</span></div></div>
    <div class="card">
      <div class="field">
        <label for="pwd">Password</label>
        <input id="pwd" type="password" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')unlock()">
      </div>
      <div id="gate-error" class="msg msg-error hide"></div>
      <button class="btn btn-primary" onclick="unlock()">Enter</button>
    </div>
  </section>

  <!-- main -->
  <section id="main" class="hide">
    <div class="topbar">
      <div class="brand">GC<span>Tracker</span></div>
      <a href="/">Dashboard →</a>
    </div>

    <!-- step 1: pick a client, take a photo -->
    <div id="step-start">
      <div class="card">
        <div class="field" style="margin-bottom:0;">
          <label for="client">Job</label>
          <select id="client" onchange="rememberClient()"></select>
        </div>
      </div>
      <div id="no-clients" class="msg msg-warn hide">
        No jobs yet. Add one on the dashboard first.
      </div>
      <button id="snap-btn" class="btn btn-primary btn-big" onclick="document.getElementById('photo').click()">
        📷 Add receipt
      </button>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hide" onchange="photoPicked(this)">
      <div class="hint">Opens the camera. You can confirm everything before it saves.</div>
    </div>

    <!-- step 2: reading -->
    <div id="step-reading" class="hide">
      <div class="center">
        <div class="spinner"></div>
        Reading receipt…
      </div>
    </div>

    <!-- step 3: check and save -->
    <div id="step-review" class="hide">
      <img id="preview" class="preview" alt="Receipt photo">
      <div id="review-msg" class="msg hide"></div>
      <div class="card">
        <div class="field">
          <label for="f-store">Store</label>
          <input id="f-store" type="text">
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-amount">Amount</label>
            <input id="f-amount" type="number" step="0.01" inputmode="decimal">
          </div>
          <div class="field">
            <label for="f-date">Date</label>
            <input id="f-date" type="date">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-category">Category</label>
            <select id="f-category">
              <option>Materials</option><option>Labor</option>
              <option>Mortgage</option><option>MISC</option>
            </select>
          </div>
          <div class="field">
            <label for="f-type">Type</label>
            <select id="f-type">
              <option value="purchase">Purchase</option>
              <option value="return">Return</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-items">Items</label>
          <input id="f-items" type="text">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes"></textarea>
        </div>
      </div>
      <button id="save-btn" class="btn btn-primary" onclick="save(false)">Save receipt</button>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="document.getElementById('photo').click()">Retake</button>
        <button class="btn btn-ghost" onclick="reset()">Cancel</button>
      </div>
    </div>

    <!-- step 4: saved -->
    <div id="step-done" class="hide">
      <div class="center">
        <div class="big-check">✅</div>
        <div id="done-text" style="color:#065F46;font-weight:600;font-size:16px;"></div>
      </div>
      <button class="btn btn-primary btn-big" onclick="reset()">Add another</button>
      <div class="btn-row">
        <a class="btn btn-ghost" href="/" style="text-decoration:none;">Go to dashboard</a>
      </div>
    </div>
  </section>
</div>

<script>
  const API_BASE = '';
  const PWD_KEY = 'gct_password';
  const CLIENT_KEY = 'gct_last_client';

  let password = '';
  let imageB64 = null;   // downscaled JPEG, no data: prefix
  let imageUrl = null;   // for the preview

  const $ = id => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle('hide', !on);

  function api(path, options = {}) {
    const headers = Object.assign({}, options.headers || {}, { 'X-Admin-Password': password });
    return fetch(API_BASE + path, Object.assign({}, options, { headers }));
  }

  // --- password ---------------------------------------------------------

  async function unlock() {
    const value = $('pwd').value;
    if (!value) return;
    try {
      const r = await fetch(API_BASE + '/auth-check', { headers: { 'X-Admin-Password': value } });
      const data = await r.json();
      if (!data.ok) {
        $('gate-error').textContent = 'Wrong password.';
        show('gate-error', true);
        $('pwd').value = '';
        return;
      }
      password = value;
      try { localStorage.setItem(PWD_KEY, value); } catch (e) {}
      startApp();
    } catch (e) {
      $('gate-error').textContent = 'Cannot reach the server.';
      show('gate-error', true);
    }
  }

  async function startApp() {
    show('gate', false);
    show('main', true);
    await loadClients();
  }

  // --- clients ----------------------------------------------------------

  async function loadClients() {
    try {
      const r = await api('/clients');
      const clients = await r.json();
      const sel = $('client');
      sel.innerHTML = '';
      clients.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = c.name;
        sel.appendChild(o);
      });
      let last = null;
      try { last = localStorage.getItem(CLIENT_KEY); } catch (e) {}
      if (last && clients.some(c => String(c.id) === String(last))) sel.value = last;

      const none = clients.length === 0;
      show('no-clients', none);
      $('snap-btn').disabled = none;
    } catch (e) {
      show('no-clients', true);
      $('no-clients').textContent = 'Could not load jobs. Check your connection.';
    }
  }

  function rememberClient() {
    try { localStorage.setItem(CLIENT_KEY, $('client').value); } catch (e) {}
  }

  // --- photo ------------------------------------------------------------

  // Phone photos are 5-10MB; the API caps images at 5MB and big uploads are
  // slow on site wifi. Downscale to 1600px before sending.
  function downscale(file, maxDim = 1600, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read the photo'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not open the photo'));
        img.onload = () => {
          let { width, height } = img;
          const scale = Math.min(1, maxDim / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function dataUrlToBlob(dataUrl) {
    const [head, body] = dataUrl.split(',');
    const bytes = atob(body);
    const buf = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i);
    return new Blob([buf], { type: head.match(/:(.*?);/)[1] });
  }

  async function photoPicked(input) {
    const file = input.files && input.files[0];
    input.value = '';           // so picking the same file again still fires
    if (!file) return;

    step('reading');
    try {
      const dataUrl = await downscale(file);
      imageUrl = dataUrl;
      imageB64 = dataUrl.split(',')[1];

      const form = new FormData();
      form.append('photo', dataUrlToBlob(dataUrl), 'receipt.jpg');
      const r = await api('/analyze', { method: 'POST', body: form });
      const data = await r.json();

      if (!data.success) {
        fillForm({});
        showReview(data.error || 'Could not read the receipt — fill it in below.', 'warn');
        return;
      }
      fillForm(data.receipt || {});
      showReview('', null);
    } catch (e) {
      fillForm({});
      showReview((e && e.message) || 'Something went wrong — fill it in below.', 'warn');
    }
  }

  // --- review + save ----------------------------------------------------

  function today() { return new Date().toISOString().slice(0, 10); }

  function fillForm(r) {
    $('f-store').value = r.store || '';
    $('f-amount').value = (r.total !== undefined && r.total !== null) ? r.total : '';
    $('f-date').value = r.date || today();
    $('f-category').value = ['Materials', 'Labor', 'Mortgage', 'MISC'].includes(r.category) ? r.category : 'MISC';
    $('f-type').value = r.type === 'return' ? 'return' : 'purchase';
    $('f-items').value = Array.isArray(r.items) ? r.items.join(', ') : (r.items || '');
    $('f-notes').value = r.notes || '';
  }

  function showReview(message, kind) {
    $('preview').src = imageUrl || '';
    const box = $('review-msg');
    if (message) {
      box.textContent = message;
      box.className = 'msg ' + (kind === 'warn' ? 'msg-warn' : 'msg-error');
      show('review-msg', true);
    } else {
      show('review-msg', false);
    }
    step('review');
  }

  function step(name) {
    ['start', 'reading', 'review', 'done'].forEach(s => show('step-' + s, s === name));
  }

  async function save(force) {
    const btn = $('save-btn');
    const amount = parseFloat($('f-amount').value);
    if (!$('f-store').value.trim()) { flag('Store is required.'); return; }
    if (isNaN(amount)) { flag('Amount is required.'); return; }

    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const r = await api('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          client_id: parseInt($('client').value, 10),
          date: $('f-date').value || today(),
          store: $('f-store').value.trim(),
          category: $('f-category').value,
          type: $('f-type').value,
          amount: amount,
          items: $('f-items').value.trim(),
          notes: $('f-notes').value.trim(),
          image_base64: imageB64,
          source: 'mobile',
          force: !!force
        })
      });
      const data = await r.json();

      if (data.duplicate) {
        const box = $('review-msg');
        box.className = 'msg msg-warn';
        box.innerHTML = '';
        box.appendChild(document.createTextNode(data.error + ' '));
        const again = document.createElement('button');
        again.textContent = 'Save anyway';
        again.className = 'btn btn-primary';
        again.style.marginTop = '10px';
        again.onclick = () => save(true);
        box.appendChild(again);
        show('review-msg', true);
        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        btn.disabled = false;
        btn.textContent = 'Save receipt';
        return;
      }

      if (!data.success) { flag(data.error || 'Could not save.'); return; }

      $('done-text').textContent =
        $('f-store').value.trim() + ' · $' + Math.abs(amount).toFixed(2) + ' saved';
      step('done');
    } catch (e) {
      flag('Cannot reach the server.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save receipt';
    }
  }

  function flag(message) {
    const box = $('review-msg');
    box.textContent = message;
    box.className = 'msg msg-error';
    show('review-msg', true);
    $('save-btn').disabled = false;
    $('save-btn').textContent = 'Save receipt';
  }

  function reset() {
    imageB64 = null;
    imageUrl = null;
    show('review-msg', false);
    step('start');
    loadClients();
  }

  // --- boot -------------------------------------------------------------

  (async function boot() {
    let saved = null;
    try { saved = localStorage.getItem(PWD_KEY); } catch (e) {}
    if (saved) {
      try {
        const r = await fetch(API_BASE + '/auth-check', { headers: { 'X-Admin-Password': saved } });
        if ((await r.json()).ok) { password = saved; await startApp(); step('start'); return; }
      } catch (e) { /* fall through to the password screen */ }
    }
    show('gate', true);
  })();
</script>
</body>
</html>
